<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERN · Backend Index · grouped days</title>
    <style>
        /* ----------------------------------------------
           RESET & BASE
        ---------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e2eaf5 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.5;
            color: #1e2b3c;
        }

        /* main card */
        .index-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25),
                        0 8px 24px -8px rgba(0, 0, 0, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: box-shadow 0.3s ease;
        }

        /* header section */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-block;
            background: #1e3c5c;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0.35rem 1rem;
            border-radius: 40px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(20, 50, 80, 0.2);
        }

        h1 {
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            font-weight: 700;
            line-height: 1.2;
            color: #0b1e2e;
            letter-spacing: -0.02em;
        }

        h1 span {
            background: linear-gradient(135deg, #2d5a8c, #0e2c4b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subhead {
            font-size: 1rem;
            color: #43617c;
            margin-top: 0.5rem;
            font-weight: 400;
            border-bottom: 2px dashed rgba(45, 90, 140, 0.2);
            padding-bottom: 1.25rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* grid for day cards */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0 1rem;
        }

        /* each day card */
        .day-card {
            background: white;
            border-radius: 1.75rem;
            padding: 1.5rem 1.25rem 1.25rem;
            box-shadow: 0 6px 18px rgba(20, 40, 60, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        /* subtle accent line at bottom */
        .day-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #7aa9d9, #2a5f8a);
            opacity: 0.45;
            transition: opacity 0.2s, height 0.2s;
        }

        .day-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 28px -10px rgba(20, 60, 100, 0.2);
            border-color: #b8d0e8;
        }

        .day-card:hover::after {
            opacity: 1;
            height: 6px;
        }

        /* day title row */
        .day-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px dashed rgba(45, 90, 140, 0.2);
        }

        .day-title {
            font-weight: 700;
            font-size: 1.25rem;
            color: #1a3a5a;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .day-title .day-emoji {
            font-size: 1.2rem;
        }

        .task-count {
            background: #eef4fc;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2a5f8a;
            border: 1px solid rgba(70, 130, 200, 0.3);
            white-space: nowrap;
        }

        /* file chips container */
        .file-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 0.25rem;
        }

        /* each file link chip */
        .file-link {
            background: #f5f9ff;
            border: 1px solid #d0e2f5;
            border-radius: 2rem;
            padding: 0.45rem 1.1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a3a5a;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .file-link::before {
            content: '📄';
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .file-link:hover {
            background: #ffffff;
            border-color: #2a5f8a;
            color: #0b1e2e;
            box-shadow: 0 6px 12px rgba(30, 80, 130, 0.15);
            transform: translateY(-1px);
        }

        .file-link:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        /* footer / meta */
        .meta-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            border-top: 1px solid rgba(45, 90, 140, 0.12);
            padding-top: 1.5rem;
            font-size: 0.85rem;
            color: #4b6a88;
        }

        .badge-small {
            background: #e8f0fa;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-weight: 500;
            color: #1e3f60;
            font-size: 0.75rem;
        }

        .note {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 400;
        }

        .note::before {
            content: '📁';
            font-size: 1rem;
        }

        /* ----------------------------------------------
           RESPONSIVE MEDIA QUERIES
        ---------------------------------------------- */
        /* tablets and large phones */
        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }

            .index-card {
                padding: 1.75rem 1.25rem;
                border-radius: 2rem;
            }

            .days-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1.2rem;
            }

            .day-card {
                padding: 1.25rem 1rem 1rem;
                border-radius: 1.5rem;
            }

            .day-title {
                font-size: 1.15rem;
            }

            .file-link {
                font-size: 0.75rem;
                padding: 0.35rem 0.9rem;
            }
        }

        /* small phones */
        @media (max-width: 520px) {
            body {
                padding: 0.75rem;
            }

            .index-card {
                padding: 1.5rem 1rem;
                border-radius: 1.75rem;
            }

            .header {
                margin-bottom: 1.75rem;
            }

            .badge {
                font-size: 0.65rem;
                padding: 0.25rem 0.75rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subhead {
                font-size: 0.9rem;
                padding-bottom: 1rem;
            }

            .days-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                margin: 1.5rem 0 0.5rem;
            }

            .day-card {
                padding: 1.2rem 1rem 1rem;
                border-radius: 1.25rem;
            }

            .day-title {
                font-size: 1.1rem;
            }

            .file-link {
                font-size: 0.7rem;
                padding: 0.3rem 0.8rem;
            }

            .meta-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.6rem;
                margin-top: 1.5rem;
                padding-top: 1rem;
                font-size: 0.75rem;
            }
        }

        /* very narrow (optional) */
        @media (max-width: 350px) {
            .file-links {
                flex-direction: column;
                align-items: flex-start;
            }

            .file-link {
                width: 100%;
                justify-content: flex-start;
            }
        }

        /* larger screens – subtle enhancement */
        @media (min-width: 1200px) {
            .index-card {
                padding: 3rem 2.5rem;
            }

            .days-grid {
                gap: 1.75rem;
            }

            .day-card {
                padding: 1.8rem 1.5rem 1.5rem;
            }

            .file-link {
                font-size: 0.85rem;
                padding: 0.5rem 1.2rem;
            }
        }

        /* support for reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .day-card,
            .file-link {
                transition: none;
            }
            .day-card:hover,
            .file-link:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="index-card">
        <!-- header -->
        <div class="header">
            <div class="badge">MERN · backend</div>
            <h1>
                <span>Core JS & Advanced JS</span>
            </h1>
            <div class="subhead">Day-wise tasks & practice files · grouped by day</div>
        </div>

        <!-- grid of day cards (each day = one card with multiple files) -->
        <div class="days-grid">
            <!-- DAY 1 card -->
            <div class="day-card">
                <div class="day-title-row">
                    <div class="day-title">
                        <span class="day-emoji">📘</span> Day 1
                    </div>
                    <span class="task-count">1 file</span>
                </div>
                <div class="file-links">
                    <a href="JS/Day1/task.html" target="_blank" class="file-link">task.html</a>
                </div>
            </div>

            <!-- DAY 2 card -->
            <div class="day-card">
                <div class="day-title-row">
                    <div class="day-title">
                        <span class="day-emoji">📗</span> Day 2
                    </div>
                    <span class="task-count">1 file</span>
                </div>
                <div class="file-links">
                    <a href="JS/Day2/task.html" target="_blank" class="file-link">task.html</a>
                </div>
            </div>

            <!-- DAY 3 card (multiple files in the SAME box) -->
            <div class="day-card">
                <div class="day-title-row">
                    <div class="day-title">
                        <span class="day-emoji">📙</span> Day 3
                    </div>
                    <span class="task-count">2 files</span>
                </div>
                <div class="file-links">
                    <a href="JS/Day3/index.html" target="_blank" class="file-link">index.html</a>
                    <a href="JS/Day3/15.html" target="_blank" class="file-link">15.html</a>
                </div>
            </div>

            <!-- Example of a future day (optional placeholder) -->
            <div class="day-card" style="opacity:0.65;">
                <div class="day-title-row">
                    <div class="day-title">
                        <span class="day-emoji">📅</span> Day 4
                    </div>
                    <span class="task-count">soon</span>
                </div>
                <div class="file-links">
                    <span class="file-link" style="background:transparent; border-style:dashed; cursor:default;">add files</span>
                </div>
            </div>
        </div>

        <!-- footer note (purely informative) -->
        <div class="meta-footer">
            <div class="badge-small">📂 JS folder</div>
            <div class="note">All paths relative to this index · each day card holds all its files</div>
        </div>
    </div>
</body>
</html>
